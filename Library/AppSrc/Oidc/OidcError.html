<html>
    <head>
        <title>{{PAGE_TITLE}}</title>
        <style>
            :root {
                --default-color: #f55d06;
                --brand-color: var(--default-color);
            }

            body {
                background-color: #f4f4f4; 
                font-family: Arial, sans-serif;
                padding: 20px;
            }

            .content-container {
                max-width: 800px;
                margin: 0 auto;
                background-color: white; 
                padding: 24px;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
                border-radius: 8px;
            }

            .flex-center {
                display: flex;
                justify-content: center;
                align-items: flex-start;
                flex-direction: column;
                gap: 12px;
            }

            p {
                color: #333;
                line-height: 1.6;
                margin-bottom: 20px;
                font-size: 1.1em;
                margin: 0;
            }

            h1 {
                margin: 0;
            }

            table {
                width: 100%;
                border-collapse: collapse;
                text-align: left;
            }

            th {
                background-color: var(--brand-color, --default-color);
                color: white;
                padding: 12px 15px;
                border: 1px solid #ddd;
                text-transform: uppercase;
                font-size: 0.9em;
            }

            td {
                padding: 10px 15px;
                border: 1px solid #ddd;
                color: #555;
            }

            tr:nth-child(even) {
                background-color: #f9f9f9;
            }

            tr:hover {
                background-color: #e9e9e9;
                transition: background-color 0.3s ease;
            }
        </style>
        <style>
            :root {
                {{CSS_VARS}}
            }
        </style>
    </head>
    <body>
        <div class="content-container flex-center">
            <h1>An error occurred</h1>
            <p>{{DESCRIPTION}}</p>
            <p>See details below:</p>
            <table>
                <tr>
                    <th>Key</th>
                    <th>Value</th>
                </tr>
                {{TABLE_ROWS}}
            </table>
        </div>
    </body>
</html>
